name: Publish to PyPI

on:
  push:
    tags:
      - "v19.0.*"
  workflow_dispatch:

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The package version is plm's, the tag is typed by hand, and nothing tied
      # the two together: v19.0.1.0.13 was once pushed on a tree that declared
      # 19.0.1.0.14. A package published under a number its tag does not carry
      # cannot be rebuilt from the repository, and nobody notices until they try.
      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' \
                plm/__manifest__.py | head -1)
          echo "tag: $tag   plm/__manifest__.py: $pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $tag does not match the package version $pkg"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build twine

      # The wheel's extras come from the manifests through the same script that
      # writes aaa_requirements.txt. A drifted file means the two disagree, so
      # the tag is not worth publishing.
      - name: Check the requirements file matches the manifests
        run: python3 scripts/sync_requirements.py --check

      - name: Build wheel and sdist
        run: python -m build

      - name: Check distribution
        run: twine check dist/*

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/odooplm
    permissions:
      id-token: write # required for OIDC trusted publisher

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # To use an API token instead of trusted publisher, uncomment:
        # with:
        #   password: ${{ secrets.PYPI_API_TOKEN }}
