# Hooks kept deliberately small.
#
# The previous configuration pinned the 2020 generation of black, isort,
# autoflake, prettier and pylint. None of them builds on Python 3.12 any more —
# isort 5.5.1 fails to generate its metadata and black 20.8b1 cannot compile
# typed-ast — so pre-commit died before running a single hook and the workflow
# had been red on every push for months.
#
# Bringing them back would mean reformatting the repository in one go: black
# would rewrite 128 of the 302 python files, isort 151, prettier 167 xml files,
# and the whitespace hooks about 700 more. That is a decision on its own, not
# something to smuggle in with a lint fix, so what is left here is the part that
# is useful today and passes today: the checks that find real breakage without
# touching a single line.
#
# What was dropped, and what it would cost to bring back:
#   black, isort, autoflake, prettier   a repository wide reformat
#   trailing-whitespace, end-of-file-fixer, mixed-line-ending   ~700 files
#   check-executables-have-shebangs     362 files carry the executable bit
#   pylint / pylint-odoo                needs a current pylint-odoo and its config
#   oca-fix-manifest-website            would rewrite the website key everywhere
#   setuptools-odoo                     generates setup/ directories
exclude: |
  (?x)
  # NOT INSTALLABLE ADDONS
  # END NOT INSTALLABLE ADDONS
  # Files and folders generated by bots, to avoid loops
  ^setup/|/static/description/index\.html$|
  # We don't want to mess with tool-generated files
  .svg$|/tests/([^/]+/)?cassettes/|
  ^README\.md$|
  # Library files can have extraneous formatting (even minimized)
  /static/(src/)?lib/|
  ^docs/_templates/.*\.html$|
  # You don't usually want a bot to modify your legal texts
  (LICENSE.*|COPYING.*)
default_language_version:
  python: python3
repos:
  - repo: local
    hooks:
      - id: bump-manifest-version
        name: bump __manifest__.py patch version for modified modules
        entry: python3 .pre-commit-scripts/bump_manifest_version.py
        language: system
        pass_filenames: true
        stages: [pre-commit]
      # plm's version is the version of the odooplm pip package, and PyPI
      # rejects a version it already holds. Runs after the hook above, and
      # stands down when that one has already moved plm.
      - id: bump-plm-version
        name: bump plm/__manifest__.py so any tag stays publishable
        entry: python3 .pre-commit-scripts/bump_plm_version.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      # aaa_requirements.txt is generated from the external_dependencies of the
      # manifests; editing it by hand is what let it drift in the first place.
      - id: sync-requirements
        name: regenerate aaa_requirements.txt from the manifests
        entry: python3 scripts/sync_requirements.py
        language: system
        pass_filenames: false
        files: (__manifest__\.py|scripts/requirements_pins\.txt|aaa_requirements\.txt)$
        stages: [pre-commit]
      # LICENSING.md is the single answer to "under what licence is this?".
      # It is only worth that if it cannot drift from the manifests, which are
      # authoritative. always_run because a module can also disappear, and a
      # deletion reaches no hook through its filenames.
      - id: check-licensing
        name: manifests, LICENSING.md and LICENSES/ agree
        entry: python3 .pre-commit-scripts/check_licensing.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      # These files are most likely copier diff rejection junks; if found,
      # review them manually, fix the problem (if needed) and remove them
      - id: forbidden-files
        name: forbidden files
        entry: found forbidden files; remove them
        language: fail
        files: "\\.rej$"
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # a malformed view or data file breaks the module at install time
      - id: check-xml
      - id: check-yaml
      - id: check-merge-conflict
        # exclude files where underlines are not distinguishable from merge conflicts
        exclude: /README\.rst$|^docs/.*\.rst$
      - id: check-case-conflict
      - id: check-symlinks
      - id: check-docstring-first
      - id: debug-statements
  - repo: https://github.com/PyCQA/flake8
    rev: 7.2.0
    hooks:
      # reports, never blocks: the repository currently has ~1300 findings, most
      # of them long lines. Drop --exit-zero once that backlog is cleared.
      - id: flake8
        name: flake8 (report only)
        args: ["--exit-zero"]
        verbose: true
        additional_dependencies: ["flake8-bugbear==24.12.12"]
