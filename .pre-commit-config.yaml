# Hooks kept deliberately small, as on 19.0.
#
# The previous configuration failed on every push: eslint 7 reports a parsing
# error on compare_bom_tree.js, pyupgrade 3.15 crashes on Python 3.14, and black,
# isort, autoflake and prettier would reformat the repository.
# That reformat is a decision on its own, so what is left here is the part that
# finds real breakage without touching a single line.
#
# What was dropped, and what it would cost to bring back:
#   black, isort, autoflake, prettier   a repository wide reformat
#   eslint, pyupgrade                   current versions, and their config
#   pylint / pylint-odoo                its findings are to be reviewed first
#   oca-fix-manifest-website            would rewrite the website key everywhere
exclude: |
  (?x)
  # Files and folders generated by bots, to avoid loops
  ^setup/|/static/description/index\.html$|
  # We don't want to mess with tool-generated files
  .svg$|/tests/([^/]+/)?cassettes/|
  ^README\.md$|
  # Library files can have extraneous formatting (even minimized)
  /static/(src/)?(js/)?lib/|
  ^docs/_templates/.*\.html$|
  # You don't usually want a bot to modify your legal texts
  (LICENSE.*|COPYING.*)
default_language_version:
  python: python3
repos:
  - repo: local
    hooks:
      # These files are most likely copier diff rejection junks; if found,
      # review them manually, fix the problem (if needed) and remove them
      - id: forbidden-files
        name: forbidden files
        entry: found forbidden files; remove them
        language: fail
        files: "\\.rej$"
      - id: bump-plm-version
        name: Bump plm app version
        entry: python3 scripts/bump_plm_version.py
        language: system
        pass_filenames: false
        always_run: true
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # a malformed view or data file breaks the module at install time
      - id: check-xml
      - id: check-yaml
      - id: check-merge-conflict
        # exclude files where underlines are not distinguishable from merge conflicts
        exclude: /README\.rst$|^docs/.*\.rst$
      - id: check-case-conflict
      - id: check-symlinks
      - id: check-docstring-first
      - id: debug-statements
  - repo: https://github.com/PyCQA/flake8
    rev: 7.2.0
    hooks:
      # reports, never blocks: drop --exit-zero once the backlog is cleared
      - id: flake8
        name: flake8 (report only)
        args: ["--exit-zero"]
        verbose: true
        additional_dependencies: ["flake8-bugbear==24.12.12"]
